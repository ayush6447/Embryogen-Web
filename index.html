  <script>
    // Apply the saved theme before React paints, so there is no light-mode flash.
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* localStorage blocked (private mode): fall through to light. */
      }
    })();
  </script>

  <style>
    @font-face {
      font-family: 'Syne';
      src: url('/fonts/Syne-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Syne';
      src: url('/fonts/Syne-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {

      src: url('/fonts/Syne-Bold.ttf') format('truetype');
      font-weight: 800;

  </style>
</head>
